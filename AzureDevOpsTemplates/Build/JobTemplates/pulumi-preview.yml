parameters:
  AzureSubscription:
  EnvironmentVariables:
  ProjectName:
  PulumiProjectRoot:
  PulumuiStateLocation:
  Stack:
  # Optional steps run after checkout and before Pulumi, e.g. to write
  # credentials for a non-Azure provider. Defaults to none.
  PreSteps: []

jobs:
- job: PulumiPreview_${{ parameters.Stack }}
  steps:
  - checkout: self
  - ${{ each Step in parameters.PreSteps }}:
    - ${{ Step }}
  - task: Pulumi@1
    displayName: Pulumi Install
    inputs:
      azureSubscription: ${{ parameters.AzureSubscription }}
      command: install
      cwd: ${{ parameters.PulumiProjectRoot }}
      stack: organization/${{ parameters.ProjectName }}/${{ parameters.Stack }}
      loginArgs: ${{ parameters.PulumuiStateLocation }}
  - task: Pulumi@1
    displayName: Pulumi Preview
    inputs:
      azureSubscription: ${{ parameters.AzureSubscription }}
      command: preview
      args: --refresh --diff
      cwd: ${{ parameters.PulumiProjectRoot }}
      stack: organization/${{ parameters.ProjectName }}/${{ parameters.Stack }}
      loginArgs: ${{ parameters.PulumuiStateLocation }}
    env:
      ${{ each EnvVar in parameters.EnvironmentVariables }}:
        ${{ EnvVar.key }}: ${{ EnvVar.value }}
