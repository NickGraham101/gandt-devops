parameters:
  Condition: true
  DependsOn: []
  JobName: 'BuildTestProjects'
  ArtifactBaseName:
  # optional - overrides the default retry-safe artifact name
  # (${ArtifactBaseName}_$(Build.BuildId)_$(System.JobAttempt)). A downstream job that
  # references this artifact by exact name can't reconstruct another job's
  # $(System.JobAttempt) value, so retry-safety and being consumed by name from a
  # different job are mutually exclusive - set this to opt into the latter and accept
  # that a retry of this job after it already published once will collide.
  ArtifactName: ''
  Pool:
    type: object
  # each entry: ProjectPath (csproj to publish), OutputPath (publish -o target, relative to
  # repo root), optional RunSettingsTargetPath (defaults to OutputPath) - the folder
  # RunSettingsSourcePath is copied into, e.g. the project's source root rather than its
  # publish output, when a consumer needs .runsettings to sit next to the source project
  Projects: []
  ArchiveRootFolder: 'src'
  # optional: a file (e.g. .runsettings) copied into each project's RunSettingsTargetPath
  # (or OutputPath if that's not set) before archiving
  RunSettingsSourcePath: ''

jobs:
- job: ${{ parameters.JobName }}
  condition: ${{ parameters.Condition }}
  dependsOn: ${{ parameters.DependsOn }}
  pool:
    ${{ parameters.Pool }}
  steps:
  - checkout: self
  - ${{ each project in parameters.Projects }}:
    - task: DotNetCoreCLI@2
      displayName: 'dotnet publish application ${{ project.ProjectPath }}'
      inputs:
        command: publish
        projects: '${{ project.ProjectPath }}'
        arguments: '-c release -o ${{ project.OutputPath }}'
        publishWebProjects: false #set to false as this setting (which defaults to true) will parse the entire repo for web projects
        zipAfterPublish: false
        modifyOutputPath: false
    - ${{ if ne(parameters.RunSettingsSourcePath, '') }}:
      - task: CopyFiles@2
        displayName: 'Copy .runsettings into ${{ coalesce(project.RunSettingsTargetPath, project.OutputPath) }}'
        inputs:
          SourceFolder: $(Build.SourcesDirectory)
          Contents: ${{ parameters.RunSettingsSourcePath }}
          TargetFolder: ${{ coalesce(project.RunSettingsTargetPath, project.OutputPath) }}
          flattenFolders: true
  - task: ArchiveFiles@2
    displayName: 'Archive ${{ parameters.ArtifactBaseName }}'
    inputs:
      rootFolderOrFile: ${{ parameters.ArchiveRootFolder }}
      archiveFile: $(build.artifactstagingdirectory)/Artifact/${{ parameters.ArtifactBaseName }}/${{ parameters.ArtifactBaseName }}.zip
      includeRootFolder: false
  - task: PublishPipelineArtifact@1
    displayName: 'Publish Artifact: ${{ parameters.ArtifactBaseName }}'
    inputs:
      targetPath: $(build.artifactstagingdirectory)/Artifact/${{ parameters.ArtifactBaseName }}/
      artifactName: ${{ coalesce(parameters.ArtifactName, format('{0}_$(Build.BuildId)_$(System.JobAttempt)', parameters.ArtifactBaseName)) }}
