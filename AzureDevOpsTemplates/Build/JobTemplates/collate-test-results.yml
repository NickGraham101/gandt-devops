parameters:
  Condition: true
  # required (object/array, e.g. [JobA, JobB]) - no default, since a collate job with no
  # dependencies races the jobs producing what it collates
  DependsOn:
    type: object
  AzureDevOpsOrganizationName:
  RequiredTestRunCount: 0
  BaselineBranchName: 'refs/heads/master'
  # weekly Slack report of the merged test results, sent when Build.Reason == Schedule. Omit
  # (leave empty) to skip Slack reporting entirely.
  SlackApiUrl: ''
  MessageTitle: 'Weekly Full Test Results'
  # semicolon-joined glob pattern(s) for reportgenerator's `reports` input
  CoverageReportsGlob:
  # reportgenerator's `sourcedirs` input
  CoverageSourceDirs:
  # each entry: Path (required, download destination); ArtifactName (optional - omit to
  # download all artifacts into Path, e.g. when the producing job's exact
  # $(System.JobAttempt) can't be known here); optionally ExtractZip (zip file name
  # inside Path) + ExtractDestination (defaults to Path) to extract it after download;
  # optionally ContinueOnError (bool, default false)
  DownloadArtifacts: []

jobs:
- job: CollateTestResults
  condition: ${{ parameters.Condition }}
  dependsOn: ${{ parameters.DependsOn }}
  steps:
  - checkout: self
  - checkout: gandt-devops
  - checkout: gandt-azure-devops-tools
  - ${{ each artifact in parameters.DownloadArtifacts }}:
    - task: DownloadPipelineArtifact@2
      displayName: 'Download ${{ coalesce(artifact.ArtifactName, "all artifacts") }} to ${{ artifact.Path }}'
      inputs:
        ${{ if ne(coalesce(artifact.ArtifactName, ''), '') }}:
          artifact: ${{ artifact.ArtifactName }}
        path: ${{ artifact.Path }}
      continueOnError: ${{ coalesce(artifact.ContinueOnError, false) }}
    - ${{ if ne(coalesce(artifact.ExtractZip, ''), '') }}:
      - task: ExtractFiles@1
        displayName: 'Extract ${{ artifact.ExtractZip }}'
        inputs:
          archiveFilePatterns: ${{ artifact.Path }}/${{ artifact.ExtractZip }}
          destinationFolder: ${{ coalesce(artifact.ExtractDestination, artifact.Path) }}
          cleanDestinationFolder: true
  - task: reportgenerator@5
    displayName: Report Generator
    inputs:
      reports: '${{ parameters.CoverageReportsGlob }}'
      sourcedirs: ${{ parameters.CoverageSourceDirs }}
      targetdir: '$(Agent.TempDirectory)/coveragereport'
      reporttypes: 'HtmlInline_AzurePipelines;Cobertura'
      verbosity: 'Verbose' # The verbosity level of the log messages. Values: Verbose, Info, Warning, Error, Off
      customSettings: 'settings:customHeadersForRemoteFiles=Authorization=Bearer $(System.AccessToken)'
      publishCodeCoverageResults: true
  - task: PowerShell@2
    name: CheckForFailedTests
    displayName: Check for failed tests
    inputs:
      targetType: 'filePath'
      filePath: $(Build.SourcesDirectory)/gandt-devops/PSScripts/Test-AllTestResults.ps1
      arguments: >-
        -AzureDevOpsOrganizationName ${{ parameters.AzureDevOpsOrganizationName }}
        -BuildId $(Build.BuildId)
        -ModulePath $(Build.SourcesDirectory)/gandt-azure-devops-tools/gandt-azure-devops-tools/gandt-azure-devops-tools.psm1
        -PatToken $(System.AccessToken)
        -ProjectId $(System.TeamProject)
        -Verbose
      pwsh: true
  - ${{ if ne(parameters.SlackApiUrl, '') }}:
    - task: PowerShell@2
      # CheckForFailedTests fails (Write-Error, default errorActionPreference=stop) both when
      # tests genuinely failed (after setting its output variables) and when no test results
      # were retrieved at all (before setting them) - succeeded() alone would wrongly suppress
      # the former, so gate on TotalTests actually having been set instead.
      condition: and(in(variables['Build.Reason'], 'Schedule'), ne(variables['CheckForFailedTests.TotalTests'], ''))
      displayName: Set Slack Message Emoji
      inputs:
        targetType: 'inline'
        script: |
          if ($env:FailedTests -gt 0) {
            $SlackEmoji = ":warning:"
          }
          else {
            $SlackEmoji = ":white_check_mark:"
          }
          Write-Output "Setting SlackEmoji to $SlackEmoji"
          Write-Output "##vso[task.setvariable variable=SlackEmoji]$SlackEmoji"
      env:
        FailedTests: $(CheckForFailedTests.FailedTests)
    - task: PowerShell@2
      # see condition comment on 'Set Slack Message Emoji' above
      condition: and(in(variables['Build.Reason'], 'Schedule'), ne(variables['CheckForFailedTests.TotalTests'], ''))
      displayName: Report weekly test results
      inputs:
        targetType: 'filePath'
        filePath: $(Build.SourcesDirectory)/gandt-devops/PSScripts/Send-SlackMessage.ps1
        arguments: >-
          -Emoji $(SlackEmoji)
          -FallBackMessage "$(CheckForFailedTests.FailedTests) tests failed out of $(CheckForFailedTests.TotalTests) tests ran."
          -MarkdownMessage "$(CheckForFailedTests.FailedTests) tests failed out of $(CheckForFailedTests.TotalTests) tests ran on scheduled <$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=ms.vss-test-web.build-test-results-tab|build>. `n $(CheckForFailedTests.SlackTableText)"
          -MessageTitle "${{ parameters.MessageTitle }}"
          -SlackApiUrl "${{ parameters.SlackApiUrl }}"
          -Verbose
        pwsh: true
  - task: PowerShell@2
    displayName: Check number of completed test runs
    inputs:
      targetType: 'inline'
      script: |
        [int]$RequiredTestRunCount = ${{ parameters.RequiredTestRunCount }}
        if ([int]$env:CompletedTestRunCount -lt $RequiredTestRunCount) {
          throw "CompletedTestRunCount is $($env:CompletedTestRunCount), required RequiredTestRunCount is $RequiredTestRunCount, failing pipeline"
        }
    env:
      CompletedTestRunCount: $(CheckForFailedTests.CompletedTestRunCount)
  - task: PowerShell@2
    displayName: Check for code coverage changes
    inputs:
      arguments: '-Verbose -AccessToken $(System.AccessToken) -AzureDevOpsOrganizationName ${{ parameters.AzureDevOpsOrganizationName }} -AzureDevOpsToolsPath $(Build.SourcesDirectory)/gandt-azure-devops-tools/gandt-azure-devops-tools/gandt-azure-devops-tools.psm1 -BaselineBranchName "${{ parameters.BaselineBranchName }}" -BuildDefinitionId $(System.DefinitionId) -ComparisonBuildId $(Build.BuildId) -AzDevOpsProject $(System.TeamProject)'
      filePath: $(Build.SourcesDirectory)/gandt-devops/PSScripts/Test-CodeCoverage.ps1
      pwsh: true
    # ideally this will fail but Azure DevOps is not consistently reporting the coverage result from Report Generator
    continueOnError: true
