name: TestAndTag

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Setup PowerShell module cache
      id: cacher
      uses: actions/cache@v3
      with:
        path: "~/.local/share/powershell/Modules"
        key: ${{ runner.os }}-AWSPowerShell.NetCore
    - name: Install from PSGallery
      if: steps.cacher.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        Set-PSRepository PSGallery -InstallationPolicy Trusted
        Install-Module AWSPowerShell.NetCore -Verbose
    - name: Invoke Tests
      shell: pwsh
      run: Tests/Invoke-Tests.ps1
    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action/composite@v1
      if: always()
      with:
        files: '**/TEST-*.xml'
  lint-commits:
    name: Lint Commit Messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
    - name: Check commit message format
      shell: bash
      run: |
        PATTERN='^(feat|fix|chore|docs|refactor|test|style|perf|build|ci)(\([^)]*\))?!?: .+'
        FAIL=0
        while IFS= read -r subject; do
          if ! echo "$subject" | grep -qE "$PATTERN"; then
            echo "::error::Commit message does not follow Conventional Commits format: $subject"
            FAIL=1
          fi
        done < <(git log "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --pretty=format:'%s')
        exit $FAIL
  tag:
    name: Push Git Tag
    needs: [lint-commits,test]
    if: |
      always() &&
      needs.test.result == 'success' &&
      (needs.lint-commits.result == 'success' || needs.lint-commits.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
    - name: Get latest tag
      uses: actions-ecosystem/action-get-latest-tag@v1.6.0
      id: get-latest-tag
      with:
        semver_only: true
    - name: Determine bump level
      id: bump-level
      shell: bash
      run: |
        TAG="${{ steps.get-latest-tag.outputs.tag }}"
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          RANGE="$TAG..HEAD"
        else
          RANGE="HEAD"
        fi
        LOG=$(git log $RANGE --pretty=format:'%s%n%b')
        TYPES='feat|fix|chore|docs|refactor|test|style|perf|build|ci'
        if echo "$LOG" | grep -qE "^BREAKING CHANGE:|^($TYPES)(\([^)]*\))?!:"; then
          LEVEL=major
        elif echo "$LOG" | grep -qE '^feat(\([^)]*\))?:'; then
          LEVEL=minor
        else
          LEVEL=patch
        fi
        echo "Computed bump level: $LEVEL"
        echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
    - name: Bump tag
      uses: actions-ecosystem/action-bump-semver@v1.0.0
      id: bump-semver
      with:
        current_version: ${{ steps.get-latest-tag.outputs.tag }}
        level: ${{ steps.bump-level.outputs.level }}
    - name: Push tag
      uses: actions-ecosystem/action-push-tag@v1.0.0
      if: ${{ success() && github.ref == 'refs/heads/main' }}
      with:
        tag: ${{ steps.bump-semver.outputs.new_version }}
